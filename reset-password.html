<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="reset">
    <div class="page-shell">
      <div class="background-glow glow-one"></div>
      <div class="background-glow glow-two"></div>

      <main class="login-card">
        <section class="brand-panel">
          <div class="brand-badge">NX</div>
          <h1>Recuperar acesso</h1>
          <p>
            Envie seu e-mail para receber instruções e recuperar sua conta com rapidez e segurança.
          </p>
          <ul class="feature-list">
            <li>Recuperação simples</li>
            <li>Link seguro enviado por e-mail</li>
            <li>Suporte rápido</li>
          </ul>
        </section>

        <section class="form-panel">
          <div class="top-row">
            <span class="mini-label">Senha</span>
            <button class="theme-toggle" type="button" aria-label="Alternar tema">
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </button>
          </div>

          <h2>Esqueci a senha</h2>

          <form id="resetForm" novalidate>
            <div class="input-group">
              <label for="resetEmail">E-mail cadastrado</label>
              <div class="input-wrap">
                <span class="icon">@</span>
                <input id="resetEmail" type="email" placeholder="seu@email.com" required />
              </div>
            </div>

            <button type="submit" class="primary-btn">Enviar link</button>
          </form>

          <div class="options-row" style="margin-top: 18px;">
            <a href="index.html" class="link">Voltar ao login</a>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
