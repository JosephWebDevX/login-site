<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="login">
    <div class="page-shell">
      <div class="background-glow glow-one"></div>
      <div class="background-glow glow-two"></div>

      <main class="login-card">
        <section class="brand-panel">
          <div class="brand-badge">NX</div>
          <h1>Bem-vindo de volta</h1>
          <p>
            Acesse sua conta e continue sua jornada com segurança, produtividade e simplicidade.
          </p>
          <ul class="feature-list">
            <li>Login seguro</li>
            <li>Ferramentas em destaque</li>
            <li>Suporte dedicado</li>
          </ul>
        </section>

        <section class="form-panel">
          <div class="top-row">
            <span class="mini-label">Entrar</span>
            <button class="theme-toggle" type="button" aria-label="Alternar tema">
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </button>
          </div>

          <h2>Faça login</h2>

          <form id="loginForm" novalidate>
            <div class="input-group">
              <label for="email">E-mail</label>
              <div class="input-wrap">
                <span class="icon">@</span>
                <input id="email" type="email" placeholder="seu@email.com" required />
              </div>
            </div>

            <div class="input-group">
              <div class="label-row">
                <label for="password">Senha</label>
                <a href="reset-password.html" class="link">Esqueceu?</a>
              </div>
              <div class="input-wrap">
                <span class="icon">🔒</span>
                <input id="password" type="password" placeholder="Digite sua senha" required />
              </div>
            </div>

            <div class="options-row">
              <label class="checkbox-wrap">
                <input type="checkbox" />
                <span>Lembrar de mim</span>
              </label>
              <a href="signup.html" class="link">Criar conta</a>
            </div>

            <button type="submit" class="primary-btn">Entrar</button>
          </form>

          <div class="divider"><span>ou continue com</span></div>

          <div class="socials">
            <button class="social-btn" type="button">Google</button>
            <button class="social-btn" type="button">GitHub</button>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
